name: Build static macOS arm64 binaries

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mozjpeg_ref:
        description: "mozjpeg branch, tag, or commit"
        default: "v4.1.5"
        required: false
      jpegli_ref:
        description: "jpegli branch, tag, or commit"
        default: "main"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CCACHE_MAXSIZE: 1G

jobs:
  mozjpeg:
    name: mozjpeg cjpeg (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check runner is arm64
        run: test "$(uname -m)" = "arm64"

      - name: Install build tools
        run: brew install cmake ninja nasm ccache

      - name: Clone mozjpeg
        run: |
          git clone --depth 1 https://github.com/mozilla/mozjpeg mozjpeg
          cd mozjpeg
          git fetch --depth 1 origin "${{ inputs.mozjpeg_ref || 'v4.1.5' }}"
          git checkout FETCH_HEAD

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-arm64-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ccache-macos-arm64-

      - name: Restore build directory
        uses: actions/cache@v6
        with:
          path: mozjpeg/build
          key: mozjpeg-build-macos-arm64-${{ inputs.mozjpeg_ref || 'v4.1.5' }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            mozjpeg-build-macos-arm64-${{ inputs.mozjpeg_ref || 'v4.1.5' }}-
            mozjpeg-build-macos-arm64-

      # v4.1.5 spells these ENABLE_SHARED/ENABLE_STATIC (master renamed them to BUILD_SHARED_LIBS).
      - name: Configure mozjpeg
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          cmake -S mozjpeg -B mozjpeg/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_JAVA=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DPNG_SUPPORTED=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build mozjpeg
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: cmake --build mozjpeg/build -j"$(sysctl -n hw.ncpu)"

      - name: Stage and verify cjpeg
        run: |
          mkdir -p dist/mozjpeg
          cp mozjpeg/build/cjpeg-static dist/mozjpeg/cjpeg
          chmod +x dist/mozjpeg/cjpeg
          codesign --force --sign - dist/mozjpeg/cjpeg
          file dist/mozjpeg/cjpeg
          lipo -info dist/mozjpeg/cjpeg
          otool -L dist/mozjpeg/cjpeg
          dist/mozjpeg/cjpeg -version || true

      - name: Upload cjpeg
        uses: actions/upload-artifact@v7
        with:
          name: mozjpeg-macos-arm64
          path: dist/mozjpeg/cjpeg
          if-no-files-found: error
          compression-level: 0

  jpegli:
    name: jpegli cli (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check runner is arm64
        run: test "$(uname -m)" = "arm64"

      - name: Install build tools
        run: brew install cmake ninja ccache pkg-config

      - name: Clone jpegli
        run: |
          git clone --depth 1 https://github.com/google/jpegli jpegli
          cd jpegli
          git fetch --depth 1 origin "${{ inputs.jpegli_ref || 'main' }}"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-arm64-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ccache-macos-arm64-

      - name: Restore build directory
        uses: actions/cache@v6
        with:
          path: jpegli/build
          key: jpegli-build-macos-arm64-${{ inputs.jpegli_ref || 'main' }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            jpegli-build-macos-arm64-${{ inputs.jpegli_ref || 'main' }}-
            jpegli-build-macos-arm64-

      - name: Configure jpegli
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          cmake -S jpegli -B jpegli/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DJPEGLI_STATIC=ON \
            -DJPEGLI_ENABLE_TOOLS=ON \
            -DJPEGLI_BUNDLE_LIBPNG=ON \
            -DBUILD_TESTING=OFF \
            -DJPEGLI_ENABLE_BENCHMARK=OFF \
            -DJPEGLI_ENABLE_MANPAGES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build jpegli
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: cmake --build jpegli/build -j"$(sysctl -n hw.ncpu)"

      - name: Stage and verify jpegli cli
        run: |
          mkdir -p dist/jpegli
          cp jpegli/build/tools/cjpegli dist/jpegli/cjpegli
          cp jpegli/build/tools/djpegli dist/jpegli/djpegli
          chmod +x dist/jpegli/cjpegli dist/jpegli/djpegli
          codesign --force --sign - dist/jpegli/cjpegli dist/jpegli/djpegli
          file dist/jpegli/cjpegli dist/jpegli/djpegli
          lipo -info dist/jpegli/cjpegli dist/jpegli/djpegli
          otool -L dist/jpegli/cjpegli

      - name: Upload jpegli cli
        uses: actions/upload-artifact@v7
        with:
          name: jpegli-macos-arm64
          path: dist/jpegli/
          if-no-files-found: error
          compression-level: 0
