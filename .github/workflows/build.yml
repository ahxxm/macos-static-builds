name: Build static macOS arm64 binaries

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mozjpeg_ref:
        description: "mozjpeg branch, tag, or commit"
        required: true
      jpegli_ref:
        description: "jpegli branch, tag, or commit"
        required: true
      emacs_ref:
        description: "emacs release tag, e.g. emacs-31.1"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CCACHE_MAXSIZE: 1G

jobs:
  pins:
    name: Resolve pins
    runs-on: ubuntu-latest
    outputs:
      mozjpeg_ref: ${{ steps.resolve.outputs.mozjpeg_ref }}
      jpegli_ref: ${{ steps.resolve.outputs.jpegli_ref }}
      emacs_ref: ${{ steps.resolve.outputs.emacs_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream refs
        id: resolve
        env:
          MOZJPEG_OVERRIDE: ${{ inputs.mozjpeg_ref }}
          JPEGLI_OVERRIDE: ${{ inputs.jpegli_ref }}
          EMACS_OVERRIDE: ${{ inputs.emacs_ref }}
        run: |
          set -a; . ./versions.env; set +a
          echo "mozjpeg_ref=${MOZJPEG_OVERRIDE:-$MOZJPEG_REF}" >> "$GITHUB_OUTPUT"
          echo "jpegli_ref=${JPEGLI_OVERRIDE:-$JPEGLI_REF}" >> "$GITHUB_OUTPUT"
          echo "emacs_ref=${EMACS_OVERRIDE:-$EMACS_REF}" >> "$GITHUB_OUTPUT"

  mozjpeg:
    name: mozjpeg cjpeg (macos-arm64)
    needs: pins
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check runner is arm64
        run: test "$(uname -m)" = "arm64"

      - name: Install build tools
        run: brew install cmake ninja nasm ccache libpng

      - name: Clone mozjpeg
        run: |
          git clone --depth 1 https://github.com/mozilla/mozjpeg mozjpeg
          cd mozjpeg
          git fetch --depth 1 origin "${{ needs.pins.outputs.mozjpeg_ref }}"
          git checkout FETCH_HEAD

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mozjpeg

      - name: Restore build directory
        uses: actions/cache@v6
        with:
          path: mozjpeg/build
          key: mozjpeg-build-macos-arm64-${{ needs.pins.outputs.mozjpeg_ref }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            mozjpeg-build-macos-arm64-${{ needs.pins.outputs.mozjpeg_ref }}-
            mozjpeg-build-macos-arm64-

      # v4.1.5 spells these ENABLE_SHARED/ENABLE_STATIC (master renamed them to BUILD_SHARED_LIBS).
      # PNG: libpng is linked as a static archive. mozjpeg restricts its own
      # PNG search to the static suffix, and CMAKE_PREFIX_PATH points it at
      # Homebrew libpng. zlib stays the system library on Apple, as upstream
      # intends (macOS ships no static zlib).
      - name: Configure mozjpeg
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          cmake -S mozjpeg -B mozjpeg/build -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libpng)" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_JAVA=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DPNG_SUPPORTED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build mozjpeg
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: cmake --build mozjpeg/build -j"$(sysctl -n hw.ncpu)"

      - name: Stage and verify cjpeg
        env:
          VERSION: ${{ needs.pins.outputs.mozjpeg_ref }}
        run: |
          mkdir -p dist/mozjpeg
          cp mozjpeg/build/cjpeg-static dist/mozjpeg/cjpeg
          chmod +x dist/mozjpeg/cjpeg
          codesign --force --sign - dist/mozjpeg/cjpeg
          file dist/mozjpeg/cjpeg
          lipo -info dist/mozjpeg/cjpeg
          otool -L dist/mozjpeg/cjpeg
          if otool -L dist/mozjpeg/cjpeg | grep '\.dylib' | grep -vE '/usr/lib/'; then
            echo "FAIL: non-system dynamic library linked" >&2
            exit 1
          fi
          dist/mozjpeg/cjpeg -version || true
          (cd dist/mozjpeg && zip -q "../mozjpeg-${VERSION}.zip" cjpeg)
          ls -la dist/*.zip

      - name: Upload cjpeg
        uses: actions/upload-artifact@v7
        with:
          name: mozjpeg-macos-arm64
          path: dist/mozjpeg-*.zip
          if-no-files-found: error
          compression-level: 0

      # Upserts the zip into the release named for the current year.
      - name: Publish to current-year release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          YEAR=$(date -u +%Y)
          gh release view "$YEAR" >/dev/null 2>&1 || gh release create "$YEAR" --title "$YEAR" --generate-notes || true
          gh release upload "$YEAR" dist/mozjpeg-*.zip --clobber

  jpegli:
    name: jpegli cli (macos-arm64)
    needs: pins
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check runner is arm64
        run: test "$(uname -m)" = "arm64"

      - name: Install build tools
        run: brew install cmake ninja ccache pkg-config giflib jpeg-turbo

      - name: Clone jpegli
        run: |
          git clone --depth 1 https://github.com/google/jpegli jpegli
          cd jpegli
          git fetch --depth 1 origin "${{ needs.pins.outputs.jpegli_ref }}"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cjpegli

      - name: Restore build directory
        uses: actions/cache@v6
        with:
          path: jpegli/build
          key: jpegli-build-macos-arm64-${{ needs.pins.outputs.jpegli_ref }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            jpegli-build-macos-arm64-${{ needs.pins.outputs.jpegli_ref }}-
            jpegli-build-macos-arm64-

      # Explicit .a paths: jpegli finds GIF/JPEG with find_package, and a
      # command-line CMAKE_FIND_LIBRARY_SUFFIXES does not survive project()
      # on Apple, so the search would fall back to the shared libraries.
      # Passing the archive paths directly skips that search. OpenEXR is off
      # so pkg-config cannot pull in its shared libraries either.
      - name: Configure jpegli
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          cmake -S jpegli -B jpegli/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGIF_LIBRARY=$(brew --prefix giflib)/lib/libgif.a \
            -DGIF_INCLUDE_DIR=$(brew --prefix giflib)/include \
            -DJPEG_LIBRARY=$(brew --prefix jpeg-turbo)/lib/libjpeg.a \
            -DJPEG_INCLUDE_DIR=$(brew --prefix jpeg-turbo)/include \
            -DBUILD_SHARED_LIBS=OFF \
            -DJPEGLI_STATIC=ON \
            -DJPEGLI_ENABLE_TOOLS=ON \
            -DJPEGLI_BUNDLE_LIBPNG=ON \
            -DJPEGLI_ENABLE_OPENEXR=OFF \
            -DBUILD_TESTING=OFF \
            -DJPEGLI_ENABLE_BENCHMARK=OFF \
            -DJPEGLI_ENABLE_MANPAGES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build jpegli
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: cmake --build jpegli/build -j"$(sysctl -n hw.ncpu)"

      - name: Stage and verify jpegli cli
        run: |
          mkdir -p dist/jpegli
          cp jpegli/build/tools/cjpegli dist/jpegli/cjpegli
          cp jpegli/build/tools/djpegli dist/jpegli/djpegli
          chmod +x dist/jpegli/cjpegli dist/jpegli/djpegli
          codesign --force --sign - dist/jpegli/cjpegli dist/jpegli/djpegli
          file dist/jpegli/cjpegli dist/jpegli/djpegli
          lipo -info dist/jpegli/cjpegli dist/jpegli/djpegli
          otool -L dist/jpegli/cjpegli
          if otool -L dist/jpegli/cjpegli dist/jpegli/djpegli | grep '\.dylib' | grep -vE '/usr/lib/'; then
            echo "FAIL: non-system dynamic library linked" >&2
            exit 1
          fi
          SHA=$(git -C jpegli rev-parse --short=6 HEAD)
          echo "jpegli version (short sha): $SHA"
          (cd dist/jpegli && zip -q "../cjpegli-${SHA}.zip" cjpegli)
          (cd dist/jpegli && zip -q "../djpegli-${SHA}.zip" djpegli)
          ls -la dist/*.zip

      - name: Upload jpegli cli
        uses: actions/upload-artifact@v7
        with:
          name: jpegli-macos-arm64
          path: |
            dist/cjpegli-*.zip
            dist/djpegli-*.zip
          if-no-files-found: error
          compression-level: 0

      # Upserts the zips into the release named for the current year.
      - name: Publish to current-year release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          YEAR=$(date -u +%Y)
          gh release view "$YEAR" >/dev/null 2>&1 || gh release create "$YEAR" --title "$YEAR" --generate-notes || true
          gh release upload "$YEAR" dist/cjpegli-*.zip dist/djpegli-*.zip --clobber

  emacs:
    name: emacs-nox (macos-arm64)
    needs: pins
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check runner is arm64
        run: test "$(uname -m)" = "arm64"

      # Homebrew ships no separate emacs-nox formula: core 'emacs' builds the
      # terminal-only editor on macOS (--without-x --without-ns). This job
      # mirrors its configure flags and dependency set (gnutls, tree-sitter,
      # gmp); libxml2 and ncurses stay the system libraries, as the formula
      # intends. The GNU release tarball is what the formula builds from, so
      # configure and the info manuals are already generated.
      - name: Install build tools
        run: brew install pkgconf texinfo gnutls tree-sitter gmp

      # staticlib/ holds only .a symlinks, and LDFLAGS searches it before the
      # keg lib dirs, so every -l resolves to the archive instead of the
      # brew dylib.
      - name: Stage static archives
        run: |
          mkdir -p staticlib
          ln_static() {
            a="$(brew --prefix "$1")/lib/$2"
            test -f "$a" || { echo "missing static archive: $a" >&2; exit 1; }
            ln -s "$a" staticlib/
          }
          ln_static gnutls libgnutls.a
          ln_static nettle libnettle.a
          ln_static nettle libhogweed.a
          ln_static libtasn1 libtasn1.a
          ln_static p11-kit libp11-kit.a
          ln_static libunistring libunistring.a
          ln_static libidn2 libidn2.a
          ln_static gettext libintl.a
          ln_static gmp libgmp.a
          ln_static tree-sitter libtree-sitter.a

      - name: Download emacs
        env:
          EMACS_REF: ${{ needs.pins.outputs.emacs_ref }}
        run: |
          curl -fsSLO "https://ftpmirror.gnu.org/emacs/${EMACS_REF}.tar.xz"
          tar xf "${EMACS_REF}.tar.xz"

      # pkg.m4 honors preset *_CFLAGS/*_LIBS over pkg-config, so gnutls and
      # tree-sitter point straight at the staged archives. GMP is found by
      # gnulib's own -lgmp probe, which LDFLAGS resolves to the archive too.
      # libxml2 falls back to the SDK headers plus system -lxml2 (a /usr/lib
      # dylib, allowed by the check below).
      - name: Configure emacs
        env:
          EMACS_REF: ${{ needs.pins.outputs.emacs_ref }}
        run: |
          VERSION="${EMACS_REF#emacs-}"
          cd "emacs-$VERSION"
          export PATH="$(brew --prefix texinfo)/bin:$PATH"
          export CPPFLAGS="-I$(brew --prefix gmp)/include -I$(brew --prefix tree-sitter)/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/staticlib"
          export LIBGNUTLS_CFLAGS="-I$(brew --prefix gnutls)/include"
          export LIBGNUTLS_LIBS="-lgnutls -lhogweed -lnettle -lgmp -ltasn1 -lp11-kit -lunistring -lidn2 -lintl"
          export TREE_SITTER_CFLAGS="-I$(brew --prefix tree-sitter)/include"
          export TREE_SITTER_LIBS="-ltree-sitter"
          ./configure \
            --prefix="$GITHUB_WORKSPACE/dist/emacs" \
            --disable-acl \
            --with-gnutls \
            --with-xml2 \
            --with-modules \
            --with-tree-sitter \
            --without-x \
            --without-ns \
            --without-dbus \
            --without-selinux \
            --without-imagemagick

      - name: Build and install emacs
        env:
          EMACS_REF: ${{ needs.pins.outputs.emacs_ref }}
        run: |
          VERSION="${EMACS_REF#emacs-}"
          export PATH="$(brew --prefix texinfo)/bin:$PATH"
          make -C "emacs-$VERSION" -j"$(sysctl -n hw.ncpu)"
          make -C "emacs-$VERSION" install

      - name: Stage and verify emacs
        env:
          EMACS_REF: ${{ needs.pins.outputs.emacs_ref }}
        run: |
          VERSION="${EMACS_REF#emacs-}"
          codesign --force --sign - dist/emacs/bin/emacs
          file dist/emacs/bin/emacs
          otool -L dist/emacs/bin/emacs
          if otool -L dist/emacs/bin/emacs | grep '\.dylib' | grep -vE '/usr/lib/'; then
            echo "FAIL: non-system dynamic library linked" >&2
            exit 1
          fi
          dist/emacs/bin/emacs --version
          test "$(dist/emacs/bin/emacs --batch --eval '(princ (+ 2 2))')" = 4
          (cd dist && zip -qr "emacs-nox-${VERSION}.zip" emacs)
          ls -la dist/*.zip

      - name: Upload emacs
        uses: actions/upload-artifact@v7
        with:
          name: emacs-nox-macos-arm64
          path: dist/emacs-nox-*.zip
          if-no-files-found: error
          compression-level: 0

      # Upserts the zip into the release named for the current year.
      - name: Publish to current-year release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          YEAR=$(date -u +%Y)
          gh release view "$YEAR" >/dev/null 2>&1 || gh release create "$YEAR" --title "$YEAR" --generate-notes || true
          gh release upload "$YEAR" dist/emacs-nox-*.zip --clobber
